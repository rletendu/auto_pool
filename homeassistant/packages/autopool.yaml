# ---------------------------------------------------------------------------
# Template entities (decoded enums + dispatch selects)
# ---------------------------------------------------------------------------
template:

  # ----- Decoded enum text sensors ----------------------------------------
  - sensor:

      - name: AutoPool filter control state
        unique_id: autopool_filter_control_state
        state: >-
          {% set m = states('sensor.autopool_filter_control_state_raw') | int(-1) %}
          {{ {0:'IDLE',1:'WARM_UP',2:'ACTIVE',3:'EXTENDED',4:'PERIODIC'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_filter_control_state_raw') }}"
        icon: mdi:state-machine

      - name: AutoPool ORP control state
        unique_id: autopool_orp_control_state
        state: >-
          {% set m = states('sensor.autopool_orp_control_state_raw') | int(-1) %}
          {{ {0:'IDLE',1:'INJECTION_ON',2:'INJECTION_OFF'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_orp_control_state_raw') }}"
        icon: mdi:state-machine

      - name: AutoPool pH control state
        unique_id: autopool_ph_control_state
        state: >-
          {% set m = states('sensor.autopool_ph_control_state_raw') | int(-1) %}
          {{ {0:'IDLE',1:'MINUS_ON',2:'PLUS_ON',3:'MINUS_OFF',4:'PLUS_OFF'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_ph_control_state_raw') }}"
        icon: mdi:state-machine

  # ----- Mode selects (template, dispatch CMD topic per option) -----------
  - select:

      - name: AutoPool filter mode
        unique_id: autopool_filter_mode
        state: >-
          {% set m = states('sensor.autopool_filter_mode_raw') | int(-1) %}
          {{ {0:'OFF',1:'ON',2:'AUTO'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_filter_mode_raw') }}"
        options: ["OFF", "ON", "AUTO"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/FILTER_MODE_{{ option }}"
              payload: ""
        icon: mdi:water-pump

      - name: AutoPool filter power
        unique_id: autopool_filter_power
        state: >-
          {% set m = states('sensor.autopool_filter_power_raw') | int(-1) %}
          {{ {0:'FULL',1:'REG'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_filter_power_raw') }}"
        options: ["FULL", "REG"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/FILTER_PWR_{{ option }}"
              payload: ""
        icon: mdi:speedometer

      - name: AutoPool ORP mode
        unique_id: autopool_orp_mode
        state: >-
          {% set m = states('sensor.autopool_orp_mode_raw') | int(-1) %}
          {{ {0:'OFF',1:'ON',2:'AUTO'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_orp_mode_raw') }}"
        options: ["OFF", "ON", "AUTO"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/ORP_MODE_{{ option }}"
              payload: ""
        icon: mdi:flash

      # filter_auto_mode lives in PARAM struct → publish CMD/PARAMETERS.
      - name: AutoPool filter auto mode
        unique_id: autopool_filter_auto_mode
        state: >-
          {% set m = states('sensor.autopool_filter_auto_mode_raw') | int(-1) %}
          {{ {0:'TIMER_PROG',1:'TIMER_FCT_T'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_filter_auto_mode_raw') }}"
        options: ["TIMER_PROG", "TIMER_FCT_T"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/PARAMETERS"
              payload: >-
                {%- from 'autopool.jinja' import build_param_payload -%}
                {{ build_param_payload('filter_auto_mode',
                     0 if option == 'TIMER_PROG' else 1) }}

      # ----- pH mode selects (full PH_STATE rewrite) -----------------------
      - name: AutoPool pH minus mode
        unique_id: autopool_ph_minus_mode
        state: >-
          {% set m = states('sensor.autopool_ph_minus_mode_raw') | int(-1) %}
          {{ {0:'OFF',1:'ON',2:'AUTO'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_ph_minus_mode_raw') }}"
        options: ["OFF", "ON", "AUTO"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/PH_STATE"
              payload: >-
                {%- from 'autopool.jinja' import build_ph_state_payload -%}
                {{ build_ph_state_payload('ph_minus_mode',
                     {'OFF':0,'ON':1,'AUTO':2}[option]) }}
        icon: mdi:flask-minus

      - name: AutoPool pH plus mode
        unique_id: autopool_ph_plus_mode
        state: >-
          {% set m = states('sensor.autopool_ph_plus_mode_raw') | int(-1) %}
          {{ {0:'OFF',1:'ON',2:'AUTO'}.get(m,'unknown') }}
        availability: "{{ has_value('sensor.autopool_ph_plus_mode_raw') }}"
        options: ["OFF", "ON", "AUTO"]
        select_option:
          - action: mqtt.publish
            data:
              topic: "autopool/CMD/PH_STATE"
              payload: >-
                {%- from 'autopool.jinja' import build_ph_state_payload -%}
                {{ build_ph_state_payload('ph_plus_mode',
                     {'OFF':0,'ON':1,'AUTO':2}[option]) }}
        icon: mdi:flask-plus


# ---------------------------------------------------------------------------
# Boot priming
# ---------------------------------------------------------------------------
automation:

  - alias: AutoPool prime caches at startup
    id: autopool_prime_caches
    triggers:
      - trigger: homeassistant
        event: start
      - trigger: mqtt
        topic: "autopool/MEAS"
    action:
      - delay: "00:00:03"
      - action: mqtt.publish
        data:
          topic: "autopool/CMD/GET_PARAMETERS"
          payload: ""
      - action: mqtt.publish
        data:
          topic: "autopool/CMD/GET_STATES"
          payload: ""
    mode: single
    max_exceeded: silent
